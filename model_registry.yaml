    job_id: 1146922
    date: 2026-05-21
    notes: |
      Param-matched baseline against MoE (22.4M).
      Achieves 3.5% better PPL than MoE at equal parameter budget.
      Disproves earlier claim that MoE outperforms GPT at matched scale.

  # ═══════════════════════════════════════════════════════════════════════
  # Track B: Conditioning Encoders (66M DistilBERT)
  # ═══════════════════════════════════════════════════════════════════════
  - name: Personality Encoder
    track: B
    type: encoder
    backbone: distilbert-base-uncased
    params: 66M
    task: OCEAN regression (5 dimensions)
    best_metric: val_f1=0.678
    best_epoch: 4
    secondary_metrics:
      val_acc: 0.523
      val_mse: 0.248
    checkpoint: artifacts/personality_encoder/slurm_816218_slm_personality_20260502_171023/best_model
    status: complete
    exit_code: 0

  - name: Affect Encoder
    track: B
    type: encoder
    backbone: distilbert-base-uncased
    params: 66M
    task: VAD regression (3 dimensions)
    best_metric: val_ccc=0.559
    best_epoch: 13
    secondary_metrics:
      val_mse: 0.005
    checkpoint: artifacts/affect_encoder/slurm_816219_slm_affect_20260502_171023/best_model
