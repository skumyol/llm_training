# ── Teacher provider pool ────────────────────────────────────────────────
# List multiple providers to generate episodes in parallel.
# One worker thread is spawned per entry; each gets its own Labeler and RNG.
# Remote API providers (azure, openrouter) run truly concurrently.
# local_hf serialises internally (GPU) but can share the bus with remote calls.
#
# To use a single provider, keep only one entry in the list.
# Env-var names (ALL_CAPS) are resolved at runtime from the environment.

teachers:
  - provider: local_hf
    model: Qwen/Qwen2.5-3B-Instruct
    quantization: 4bit
    device_map: auto
    torch_dtype: bfloat16
    temperature: 0.7
    max_tokens: 512

  # ── Uncomment to add Azure worker ───────────────────────────────────────
  # - provider: azure
  #   model: gpt-4o-mini          # Azure deployment name
  #   api_key: AZURE_API_KEY      # Matches .env
  #   azure_endpoint: https://YOUR_RESOURCE.openai.azure.com  # Set this or export AZURE_OPENAI_ENDPOINT
  #   api_version: "2024-02-01"
  #   temperature: 0.7
  #   max_tokens: 512

  # ── Uncomment to add DashScope worker ───────────────────────────────────
  # - provider: dashscope
  #   model: qwen-turbo
  #   api_key: DASHSCOPE_API_KEY
  #   base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  #   temperature: 0.7
  #   max_tokens: 512

  # ── Uncomment to add OpenRouter worker ──────────────────────────────────
  # - provider: openrouter
  #   model: qwen/qwen3-8b
  #   api_key: OPENROUTER_API_KEY
  #   base_url: https://openrouter.ai/api/v1
  #   temperature: 0.7
  #   max_tokens: 512

  # ── Uncomment to add a second OpenRouter worker (different model) ────────
  # - provider: openrouter
  #   model: mistralai/mistral-7b-instruct
  #   api_key: OPENROUTER_API_KEY
  #   base_url: https://openrouter.ai/api/v1
  #   temperature: 0.4
  #   max_tokens: 512

# ── Backwards-compatible single-provider fallback (used if 'teachers' absent)
# teacher:
#   provider: local_hf
#   model: Qwen/Qwen3-8B
#   quantization: 4bit

generation:
  n_episodes: 5000
  turns_per_episode_min: 5
  turns_per_episode_max: 10
  counterfactuals_per_episode: 3
  player_utterance_sampled_ratio: 0.0

scenario:
  bank_dir: data/scenario_bank
  npc_profiles_dir: data/npc_profiles
  world_context: data/world_contexts/oakhaven_siege.yaml
  scenario_type_weights:
    secret_extraction: 0.20
    apology_repair: 0.15
    alliance_negotiation: 0.15
    rumor_confrontation: 0.15
    threat_escalation: 0.10
    trust_building: 0.15
    deception_detection: 0.10

output:
  raw_episodes_dir: data/raw_episodes
  validated_turns_dir: data/validated_turns
  counterfactuals_dir: data/counterfactuals

validation:
  max_rejection_rate: 0.30
  min_response_tokens: 5
  max_response_tokens: 150
  strict_arc_adherence: true

prompts:
  scenario_instantiation: prompts/scenario_instantiation.txt
  label_C: prompts/label_C.txt
  label_A_M: prompts/label_A_M.txt
  label_R_N_D: prompts/label_R_N_D.txt
  response_generation: prompts/response_generation.txt
  player_generation: prompts/player_generation.txt

mlflow:
  experiment_name: social_state_data_generation
  tracking_uri: mlruns

schema_version: v1
seed: 42
