# ── Model ────────────────────────────────────────────────────────────────────
model_name: distilbert-base-uncased

# ── Data ─────────────────────────────────────────────────────────────────────
train_path:  data/personality/train.csv
val_path:    data/personality/val.csv
text_column: text
target_columns:
  - openness
  - conscientiousness
  - extraversion
  - agreeableness
  - neuroticism

# ── Training ─────────────────────────────────────────────────────────────────
max_length:  256
batch_size:  16
lr:          2.0e-5
epochs:      3
log_every:   20          # log step loss every N optimizer steps
seed:        42

# ── Output ───────────────────────────────────────────────────────────────────
output_dir: artifacts/personality_encoder
