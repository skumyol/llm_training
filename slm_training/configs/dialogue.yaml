# ── Backbone ─────────────────────────────────────────────────────────────────
base_model_name: TinyLlama/TinyLlama-1.1B-Chat-v1.0

# ── Data ─────────────────────────────────────────────────────────────────────
train_path:          data/dialogue/train.jsonl
val_path:            data/dialogue/val.jsonl
npc_profiles_path:   data/npc_profiles.csv   # used to build personality cache

# ── Conditioning artifacts (produced by earlier training stages) ──────────────
personality_cache_path:    artifacts/personality_cache.jsonl
affect_encoder_path:       artifacts/affect_encoder/best_model
sentence_transformer_name: sentence-transformers/all-MiniLM-L6-v2

# ── LoRA ─────────────────────────────────────────────────────────────────────
lora_r:       16
lora_alpha:   32
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj

# ── Prefix tuning ────────────────────────────────────────────────────────────
prefix_length: 8

# ── Sequence lengths ─────────────────────────────────────────────────────────
max_source_length: 768
max_target_length: 192

# ── Training ─────────────────────────────────────────────────────────────────
batch_size:       2
grad_accum_steps: 8     # effective batch = 16
lr:               2.0e-4
warmup_steps:     100
epochs:           3
log_every:        10    # log every N optimizer steps
seed:             42

# ── Output ───────────────────────────────────────────────────────────────────
output_dir: artifacts/dialogue_model
