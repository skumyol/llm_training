# Human Audit Gradio App — Docker Compose for VPS deployment
#
# Quick start:
#   1. Place your audit_input_clean.jsonl in the same directory as this file.
#   2. Run: docker compose up -d
#   3. Access the app at http://YOUR_VPS_IP:8765/
#
# To change the host port, edit the "8768:8765" mapping below.
#
# Logs:
#   docker compose logs -f
#
# Stop:
#   docker compose down
#
# Update (after code changes):
#   docker compose up -d --build

services:
  audit:
    build:
      context: .
      dockerfile: Dockerfile
    image: human-audit:latest
    container_name: human-audit
    restart: unless-stopped
    ports:
      - "8768:8765"
    volumes:
      - ./audit_input_clean.jsonl:/app/data/audit_input_clean.jsonl:ro
      - ./audit_results:/app/audit_results
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --data
      - /app/data/audit_input_clean.jsonl
      - --output
      - /app/audit_results
