# Human Audit Gradio App — Docker Compose for VPS deployment
#
# Quick start:
#   1. Place your audit_input.jsonl in the same directory as this file.
#   2. Run: docker compose up -d
#   3. Access the app at http://YOUR_VPS_IP:8765
#
# To change the host port, edit the "8765:7860" mapping below.
#
# Logs:
#   docker compose logs -f
#
# Stop:
#   docker compose down
#
# Update (after code changes):
#   docker compose up -d --build

services:
  audit:
    build:
      context: .
      dockerfile: Dockerfile
    image: human-audit:latest
    container_name: human-audit
    restart: unless-stopped
    ports:
      # Host port 8765 mapped to container port 7860.
      # Change 8765 if you need a different external port.
      - "8767:7860"
    volumes:
      # Mount your input data file (read-only)
      - ./audit_input.jsonl:/app/data/audit_input.jsonl:ro
      # Mount a directory for persistent annotation output
      - ./audit_results:/app/audit_results
    environment:
      # Optional: override the Gradio server name inside the container
      - GRADIO_SERVER_NAME=0.0.0.0
    command:
      - --host
      - 0.0.0.0
      - --port
      - "7860"
      - --data
      - /app/data/audit_input.jsonl
      - --output
      - /app/audit_results
