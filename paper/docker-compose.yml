# NPC Audit App — Next.js + FastAPI (replaces Gradio)
#
# Quick start:
#   1. Place your audit_input_clean.jsonl in the same directory as this file.
#   2. Run: docker compose up -d
#   3. Access the app at http://YOUR_VPS_IP:3018/
#
# To change the host port, edit the "3018:3018" mapping below.
#
# Logs:
#   docker compose logs -f
#
# Stop:
#   docker compose down
#
# Update (after code changes):
#   docker compose up -d --build

services:
  audit:
    build:
      context: .
      dockerfile: Dockerfile
    image: human-audit:latest
    container_name: human-audit
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "3018:3018"
    volumes:
      - ./audit_input_clean.jsonl:/app/data/audit_input_clean.jsonl:ro
      - ./audit_results:/app/audit_results
    environment:
      - DATA_PATH=/app/data/audit_input_clean.jsonl
      - OUTPUT_DIR=/app/audit_results
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - FRONTEND_HOST=0.0.0.0
      - FRONTEND_PORT=3018
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
