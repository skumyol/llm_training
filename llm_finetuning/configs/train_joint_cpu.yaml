base_model: Qwen/Qwen3-0.6B
debug_model: Qwen/Qwen3-0.6B

quantization: null
torch_dtype: float32

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, v_proj]
  bias: none
  task_type: CAUSAL_LM

training:
  lr: 5.0e-5
  epochs: 1
  max_seq_len: 256
  heads_max_seq_len: 256
  batch_size: 1
  grad_accum: 4
  gradient_checkpointing: false
  weight_decay: 0.01
  max_grad_norm: 1.0
  bf16: false
  dataloader_num_workers: 0
  logging_steps: 5

loss_weights:
  lambda_C: 1.0
  lambda_A: 1.0
  lambda_M: 1.5
  lambda_R: 2.0
  lambda_N: 1.0
  lambda_D: 2.0
  lambda_Y: 1.0
  lambda_consistency: 0.5

init_from:
  latent_checkpoint: null
  response_checkpoint: null

data:
  train_file: data/splits/train_sft.jsonl
  val_file: data/splits/val_sft.jsonl
  heads_train_file: data/splits/train_heads.jsonl
  heads_val_file: data/splits/val_heads.jsonl

output:
  checkpoint_dir: checkpoints/joint_model_cpu
  best_model_dir: checkpoints/joint_model_cpu_best

mlflow:
  experiment_name: joint_training
  run_name: qwen3_0.6b_cpu_test
  tracking_uri: mlruns

schema_version: v1
seed: 42
