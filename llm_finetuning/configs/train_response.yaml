base_model: Qwen/Qwen3-4B
debug_model: Qwen/Qwen3-1.7B

quantization: 4bit
bnb_4bit_compute_dtype: bfloat16
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: [q_proj, v_proj, k_proj, o_proj, gate_proj, up_proj, down_proj]
  bias: none
  task_type: CAUSAL_LM

training:
  lr: 1.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.05
  epochs: 3
  max_seq_len: 2048
  batch_size: 1
  grad_accum: 32
  gradient_checkpointing: true
  weight_decay: 0.01
  max_grad_norm: 1.0
  bf16: true
  label_smoothing: 0.05
  dataloader_num_workers: 0
  eval_steps: 200
  save_steps: 400
  logging_steps: 20
  load_best_model_at_end: true
  metric_for_best_model: val/rouge_l

conditioning_mode: gold
latent_predictor_checkpoint: null

data:
  train_file: data/splits/train_sft.jsonl
  val_file: data/splits/val_sft.jsonl
  artifact_type: sft

output:
  checkpoint_dir: checkpoints/response_generator
  best_model_dir: checkpoints/response_generator_best

mlflow:
  experiment_name: response_generation
  run_name: qwen3_4b_schema_v1_response_gold
  tracking_uri: mlruns

schema_version: v1
seed: 42
