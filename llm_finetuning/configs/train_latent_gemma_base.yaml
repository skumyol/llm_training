# Gemma-4-E2B Latent Predictor — Baseline (no JEPA)
# Same protocol as Qwen latent training: same data, same heads, same loss, same selection metric.

base_model: google/gemma-4-E2B
debug_model: google/gemma-4-E2B

quantization: 4bit
bnb_4bit_compute_dtype: bfloat16
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: "all-linear"  # Gemma 4 uses Gemma4ClippableLinear — all-linear covers it
  bias: none
  task_type: CAUSAL_LM

pooling: last

training:
  lr: 2.0e-4
  head_lr: 4.0e-4
  use_progressive_lr: true
  lr_scheduler: cosine
  warmup_ratio: 0.05
  epochs: 5
  max_seq_len: 512
  batch_size: 1
  grad_accum: 32
  gradient_checkpointing: true
  weight_decay: 0.01
  max_grad_norm: 1.0
  bf16: true
  dataloader_num_workers: 0
  eval_steps: 500
  save_steps: 1000
  logging_steps: 20
  load_best_model_at_end: true
  metric_for_best_model: val/response_policy_f1
  use_weighted_sampler: true
  label_smoothing: 0.1

loss_weights:
  lambda_C: 1.0
  lambda_A: 1.0
  lambda_M: 1.5
  lambda_R: 2.0
  lambda_N: 1.0
  lambda_D: 2.0

jepa:
  enabled: false

data:
  train_file: data/splits/train_heads.jsonl
  val_file: data/splits/val_heads.jsonl
  artifact_type: head_supervision

output:
  checkpoint_dir: checkpoints/latent_predictor_gemma
  best_model_dir: checkpoints/latent_predictor_gemma_best

mlflow:
  experiment_name: latent_state_prediction
  run_name: gemma4_e2b_schema_v1_latent
  tracking_uri: mlruns

schema_version: v1
seed: 42
