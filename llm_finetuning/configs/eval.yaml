thresholds:
  response_policy_f1: 0.75
  stance_delta_accuracy: 0.70
  secret_leakage_rate: 0.05
  contradiction_rate: 0.08
  rouge_l_drop_max: 0.05
  router_false_positive_rate: 0.15

data:
  test_heads_file: data/splits/val_heads.jsonl
  test_sft_file: data/splits/val_sft.jsonl
  test_trace_file: data/splits/val_trace.jsonl

base_model: Qwen/Qwen3-1.7B
quantization: null
torch_dtype: float32
latent_predictor_checkpoint: checkpoints/latent_predictor_best
response_checkpoint: checkpoints/response_generator_best
joint_checkpoint: checkpoints/joint_model_best

generation:
  max_new_tokens: 200
  temperature: 0.7
  top_p: 0.9
  do_sample: true
  length_aware_max_tokens: true  # cap at length_multiplier * median ref tokens
  length_multiplier: 1.3        # target ~1.0-1.3 length ratio vs reference

semantic_eval:
  enabled: true
  batch_size: 8
  bertscore: true
  bertscore_lang: en
  bertscore_model_type: roberta-large
  bertscore_rescale_with_baseline: false
  mauve: false  # enable if the mauve package/model cache is available
  mauve_max_text_length: 256
  sentiment_alignment: true
  sentiment_model: cardiffnlp/twitter-roberta-base-sentiment-latest

secret_strings_file: data/splits/test_secret_index.json

# Routing eval mode:
#   "gold"      -> pred_slow uses gold D_t/N_t (deterministic sanity check; F1=1.0 expected)
#   "predicted" -> pred_slow uses Z_t from latent predictor (real generalization test)
routing_mode: gold
predicted_zt_file: eval_results/predicted_zt.jsonl  # required when routing_mode=predicted
routing_missing_predictions: error  # error|skip; never fall back to gold in predicted mode

output:
  results_dir: eval_results
  save_confusion_matrices: true
  save_sample_generations: true
  n_sample_generations: 100

mlflow:
  experiment_name: routing_and_policy_eval
  tracking_uri: mlruns

schema_version: v1
